name: Deploy JARVIS demo

on:
  push:
    branches: [main]
    paths:
      - 'docs/demo-site/**'
      - 'docs/assets/demo/**'
      - 'docs/assets/screenshots/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble demo site
        run: |
          mkdir -p _demo-site/media
          cp docs/demo-site/index.html _demo-site/index.html
          cp docs/assets/demo/jarvis-live-demo.mp4 _demo-site/media/jarvis-live-demo.mp4
          cp docs/assets/screenshots/02-private-chat.png _demo-site/media/private-chat.png
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _demo-site
      - id: deployment
        uses: actions/deploy-pages@v4
