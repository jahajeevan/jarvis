<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JARVIS system overview</title>
  <desc id="desc">A visual map of the local-first JARVIS desktop assistant, showing the interface, perception, local bridge, brain, and opt-in actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse"><stop stop-color="#050E17"/><stop offset="1" stop-color="#10223A"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#E7FBFF"/><stop offset=".28" stop-color="#33D5FF"/><stop offset="1" stop-color="#006EAA" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <g opacity=".16" stroke="#76DFFF"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200"/><path d="M80 0V620M160 0V620M240 0V620M320 0V620M400 0V620M480 0V620M560 0V620M640 0V620M720 0V620M800 0V620M880 0V620M960 0V620M1040 0V620M1120 0V620"/></g>
  <text x="54" y="56" fill="#A7CBE0" font-family="ui-monospace,Menlo,monospace" font-size="16" letter-spacing="3">J.A.R.V.I.S. / LOCAL-FIRST DESKTOP INTELLIGENCE</text>
  <text x="54" y="98" fill="white" font-family="ui-sans-serif,system-ui" font-size="32" font-weight="700">A cinematic interface with a real local system behind it.</text>
  <g transform="translate(600 294)"><circle r="120" fill="url(#core)" opacity=".55"/><circle r="79" stroke="#3DDCFF" stroke-width="3" stroke-dasharray="180 42 80 23" filter="url(#glow)"/><circle r="53" stroke="#ABF4FF" stroke-width="8" stroke-dasharray="70 25" filter="url(#glow)"/><circle r="23" fill="#C8FBFF" filter="url(#glow)"/><text y="155" text-anchor="middle" fill="#C8FBFF" font-family="ui-monospace,Menlo,monospace" font-size="13">JARVIS CORE</text></g>
  <path d="M340 225C420 225 453 242 492 269M860 225C780 225 747 242 708 269M340 412C420 412 465 374 497 345M860 412C780 412 735 374 703 345" stroke="#3D9FC7" stroke-width="2" stroke-dasharray="7 8"/>
  <g transform="translate(54 160)"><rect width="286" height="132" rx="16" fill="#0B1B2B" stroke="#2AD6FF" stroke-opacity=".7"/><text x="24" y="36" fill="#58E0FF" font-family="ui-monospace,Menlo,monospace" font-size="13">01 / INTERFACE</text><text x="24" y="68" fill="white" font-family="ui-sans-serif,system-ui" font-size="20" font-weight="700">React + Three.js Arc UI</text><text x="24" y="96" fill="#A7CBE0" font-family="ui-sans-serif,system-ui" font-size="14">Showtime modes · command deck</text><text x="24" y="116" fill="#A7CBE0" font-family="ui-sans-serif,system-ui" font-size="14">keyboard controls · native shell</text></g>
  <g transform="translate(860 160)"><rect width="286" height="132" rx="16" fill="#0B1B2B" stroke="#B993FF" stroke-opacity=".75"/><text x="24" y="36" fill="#D2B8FF" font-family="ui-monospace,Menlo,monospace" font-size="13">02 / PERCEPTION</text><text x="24" y="68" fill="white" font-family="ui-sans-serif,system-ui" font-size="20" font-weight="700">Voice + gesture control</text><text x="24" y="96" fill="#BFC8E5" font-family="ui-sans-serif,system-ui" font-size="14">Local Whisper transcription</text><text x="24" y="116" fill="#BFC8E5" font-family="ui-sans-serif,system-ui" font-size="14">MediaPipe camera gestures</text></g>
  <g transform="translate(54 412)"><rect width="286" height="132" rx="16" fill="#0B1B2B" stroke="#43E3BD" stroke-opacity=".75"/><text x="24" y="36" fill="#6BF0CF" font-family="ui-monospace,Menlo,monospace" font-size="13">03 / LOCAL BRAIN</text><text x="24" y="68" fill="white" font-family="ui-sans-serif,system-ui" font-size="20" font-weight="700">Ollama + private memory</text><text x="24" y="96" fill="#B9DAD3" font-family="ui-sans-serif,system-ui" font-size="14">Qwen at localhost by default</text><text x="24" y="116" fill="#B9DAD3" font-family="ui-sans-serif,system-ui" font-size="14">Memory stays on the Mac</text></g>
  <g transform="translate(860 412)"><rect width="286" height="132" rx="16" fill="#0B1B2B" stroke="#FFB15C" stroke-opacity=".75"/><text x="24" y="36" fill="#FFC080" font-family="ui-monospace,Menlo,monospace" font-size="13">04 / OPT-IN ACTIONS</text><text x="24" y="68" fill="white" font-family="ui-sans-serif,system-ui" font-size="20" font-weight="700">System tools with consent</text><text x="24" y="96" fill="#E4CCB2" font-family="ui-sans-serif,system-ui" font-size="14">Apps · Calendar · Reminders</text><text x="24" y="116" fill="#E4CCB2" font-family="ui-sans-serif,system-ui" font-size="14">Fresh web only when requested</text></g>
  <text x="600" y="594" text-anchor="middle" fill="#89A8C5" font-family="ui-monospace,Menlo,monospace" font-size="12" letter-spacing="1.4">LOCAL BY DEFAULT  /  EXPLICIT WHEN EXTERNAL  /  CINEMATIC WITHOUT PRETENDING</text>
</svg>
