<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111b" />
    <title>J.A.R.V.I.S. — live macOS demo</title>
    <style>
      :root { color-scheme: dark; --ink: #e7f8f8; --muted: #8ea5af; --signal: #58efe1; --surface: #0a151d; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% -15%, #123c46 0, #07111b 40%, #04080d 100%); color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 54px 0 64px; }
      header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 24px; }
      h1 { letter-spacing: .26em; margin: 0 0 10px; font-size: clamp(1.4rem, 3vw, 2.5rem); }
      p { color: var(--muted); line-height: 1.65; margin: 0; }
      .status { color: var(--signal); font-size: .75rem; letter-spacing: .12em; white-space: nowrap; }
      .frame { border: 1px solid rgba(88,239,225,.35); background: var(--surface); box-shadow: 0 0 70px rgba(35,236,213,.11); padding: 9px; }
      video { width: 100%; display: block; background: #000; }
      .caption { display: flex; justify-content: space-between; gap: 16px; padding: 14px 4px 0; font-size: .76rem; }
      a { color: var(--signal); }
      @media (max-width: 600px) { main { padding-top: 32px; } header, .caption { align-items: flex-start; flex-direction: column; } .status { white-space: normal; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>J.A.R.V.I.S.</h1>
          <p>A real, local-first macOS assistant—recorded from the running app.</p>
        </div>
        <div class="status">● LOCAL BRAIN ONLINE</div>
      </header>
      <section class="frame">
        <video controls autoplay muted loop playsinline poster="media/private-chat.png">
          <source src="media/jarvis-live-demo.mp4" type="video/mp4" />
          Your browser does not support HTML video.
        </video>
      </section>
      <div class="caption">
        <span>Turn sound on for the full voice interaction.</span>
        <a href="https://github.com/jahajeevan/jarvis">View source on GitHub ↗</a>
      </div>
    </main>
  </body>
</html>
